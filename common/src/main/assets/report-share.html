<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple CarPlay · 诊断报告</title>
<style>
:root { color-scheme: light dark; --bg:#d3dbe5; --card:#f2f7fc; --text:#000000e5; --muted:#00000080; --accent:#1368fb; }
@media (prefers-color-scheme:dark) { :root { --bg:#20272e; --card:#282c31; --text:#ffffffe5; --muted:#ffffff80; --accent:#1368fb; } }
* { box-sizing:border-box; }
body { margin:0; padding:32px 20px; background:var(--bg); color:var(--text); font:18px/1.6 -apple-system,"Segoe UI",sans-serif; }
main { max-width:560px; margin:auto; }
h1 { margin:0; font-size:28px; font-weight:500; }
section { background:var(--card); border-radius:24px; padding:24px; margin-top:24px; }
h2 { font-size:22px; font-weight:500; margin:0 0 12px; }
p { color:var(--muted); margin:0 0 24px; }
a { display:block; padding:16px; border-radius:16px; background:var(--accent); color:white; font-weight:500; text-align:center; text-decoration:none; }
a:active { transform:scale(.97); }
a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
</style>
</head>
<body><main>
<h1>Apple CarPlay</h1>
<section>
<h2>诊断报告</h2>
<p>下载车机当前的诊断报告，用于分析连接、媒体焦点和方向盘按键问题。详细日志需先在车机设置中开启记录。</p>
<a href="report" download>下载诊断报告</a>
</section>
<section><p>请保持手机与车机处于同一网络。车机离开此页面或长时间无人访问后，下载服务会自动关闭。</p></section>
</main></body>
</html>
