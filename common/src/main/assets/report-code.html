<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple CarPlay</title>
<style>
:root { color-scheme:light dark; --bg:#d3dbe5; --card:#f2f7fc; --input:#f2f8fc; --text:#000000e5; --muted:#00000080; --accent:#1368fb; }
@media (prefers-color-scheme:dark) { :root { --bg:#20272e; --card:#282c31; --input:#303942; --text:#ffffffe5; --muted:#ffffff80; } }
* { box-sizing:border-box; }
body { margin:0; padding:32px 20px 40px; background:var(--bg); color:var(--text); font:18px/1.6 -apple-system,"Segoe UI",sans-serif; }
main { max-width:560px; margin:0 auto; }
h1 { font-size:28px; font-weight:500; margin:0 0 8px; }
.card { background:var(--card); border-radius:24px; padding:24px; margin-top:24px; }
.card p { color:var(--muted); margin:0 0 24px; }
input { display:block; width:100%; margin-bottom:24px; min-height:64px; padding:16px; border-radius:16px; border:0;
  background:var(--input); color:var(--text); font:28px/1.4 -apple-system,"Segoe UI",sans-serif; letter-spacing:6px; text-align:center; }
button { display:block; width:100%; min-height:56px; text-align:center; padding:16px; border-radius:16px; border:0;
  font:500 18px/1.5 -apple-system,"Segoe UI",sans-serif; cursor:pointer; background:var(--accent); color:white; }
input:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
button:disabled, input:disabled { opacity:.35; }
button:active { transform:scale(.97); }
#result { margin-top:16px; font-size:16px; color:#e8555c; min-height:24px; }
</style>
</head>
<body>
<main>
  <h1>Apple CarPlay</h1>
  <form class="card" id="form">
    <p id="prompt"></p>
    <input id="code" inputmode="numeric" aria-label="六位验证码" autocomplete="off" maxlength="7" autofocus>
    <button id="open"></button>
    <div id="result"></div>
  </form>
</main>
<script>
var t = {prompt:"请输入车机上显示的验证码，以获取诊断报告。",open:"打开诊断报告",wrong:"验证码错误。剩余次数：%1。",
  locked:"错误次数过多。请在车机上离开此页面后重新打开，以取得新的验证码。",
  fail:"无法连接车机，请检查连接后重试。"};
var $ = function(id) { return document.getElementById(id); };


$("prompt").textContent = t.prompt;
$("open").textContent = t.open;
function closed() { $("result").textContent = t.locked; $("code").disabled = true; $("open").disabled = true; }
$("form").addEventListener("submit", function(event) {
  event.preventDefault();
  // A code that is not six digits yet is not sent, so it does not cost a try.
  if ($("code").value.replace(/\D/g, "").length !== 6) { $("code").focus(); return; }
  $("open").disabled = true;
  $("result").textContent = "";
  fetch("code", {method: "POST", headers: {"Content-Type": "text/plain"}, body: $("code").value})
    .then(function(r) { return r.json(); })
    .then(function(j) {
      if (j.path) { location.replace(j.path); return; }
      if (j.locked) { closed(); return; }
      $("result").textContent = t.wrong.replace("%1", j.left);
      $("code").value = ""; $("code").focus(); $("open").disabled = false;
    })
    .catch(function() { $("result").textContent = t.fail; $("open").disabled = false; });
});
</script>
</body>
</html>
