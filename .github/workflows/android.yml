name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.1.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Local authentication asset staging boundary
        run: ./scripts/check_local_auth_assets.sh
      - name: Flyme debug and release package identities
        run: |
          ./gradlew :mobile:processDebugMainManifest :mobile:processReleaseMainManifest --stacktrace
          python3 scripts/check_flyme_manifest.py
      - name: Unit tests, lint and source-only Flyme debug build
        run: |
          mkdir -p build/architecture-validation
          java -version 2> build/architecture-validation/java.txt
          sdkmanager --list_installed > build/architecture-validation/android-sdk.txt
          set +e
          ./gradlew :flyme-eas:testDebugUnitTest :shared:testDebugUnitTest :common:testDebugUnitTest :mobile:lintDebug :mobile:assembleDebug --continue --console=plain --stacktrace > build/architecture-validation/checks.log 2>&1
          status=$?
          cat build/architecture-validation/checks.log
          printf '%s\n' "$status" > build/architecture-validation/command-exit.txt
          exit "$status"
      - name: Summarize complete validation evidence
        if: always()
        run: python3 scripts/summarize_architecture_validation.py --command-exit-file build/architecture-validation/command-exit.txt --output build/architecture-validation/validation-results.json
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/architecture-validation/
            integrations/flyme-eas/build/test-results/
            integrations/flyme-eas/build/reports/tests/
            shared/build/test-results/
            common/build/test-results/
            mobile/build/outputs/apk/
            mobile/build/intermediates/merged_manifests/
            shared/build/reports/tests/
            common/build/reports/tests/
            common/build/reports/album-artwork-ui/
            common/build/reports/no-app-update-ui/
            mobile/build/reports/lint-results-debug.html
